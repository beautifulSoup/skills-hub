# skills-hub docker compose —— 本地开发覆盖（叠加在 docker-compose.yml 之上）
#
# 用法（Makefile 的 up/down 已自动叠加；手动则）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml \
#     --profile bundled-mysql --profile bundled-redis up -d
#
# 作用：把宿主机 src/ 挂进容器，改代码即时生效（web restart / worker restart 即可）。
# 注意：挂载会盖掉镜像里编译好的 static/css/output.css，所以开发时需先 `make tailwind`
#       在宿主机生成 output.css（镜像的 venv 在 /opt/venv，不会被 ../src 挂载 shadow）。
#
# prod 部署不要用本文件——直接 -f docker-compose.yml 即可，只依赖 Docker。

services:
  web:
    volumes:
      - "../src:/app"

  worker:
    volumes:
      - "../src:/app"
